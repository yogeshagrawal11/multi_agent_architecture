# Author: Yogesh Agrawal
# supervisord manages the long-running processes inside the single container:
#   mock-bank (SQLite API), FastAPI (gateway+coordinator+agents), nginx (edge).
#
# The 3 MCP servers are NOT long-running services: they use stdio transport and
# are spawned on-demand as subprocesses by the MCP client manager
# (app/mcp_clients/manager.py) for each tool interaction. So they are not listed
# here.
#
# Internal ports are fixed (FastAPI 8000, mock-bank 9100) to match the app
# defaults in app/config.py and the nginx proxy target.
#
# Langfuse observability runs as a separate service when enabled; it is NOT
# bundled here (see docker/Dockerfile notes).

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:mock-bank]
command=python -m uvicorn mock_bank.api:app --host 127.0.0.1 --port 9100
directory=/srv/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/mock-bank.log
stderr_logfile=/var/log/mock-bank.err

[program:fastapi]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/srv/app
autostart=true
autorestart=true
priority=50
stdout_logfile=/var/log/fastapi.log
stderr_logfile=/var/log/fastapi.err

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=60
stdout_logfile=/var/log/nginx-stdout.log
stderr_logfile=/var/log/nginx-stderr.log
