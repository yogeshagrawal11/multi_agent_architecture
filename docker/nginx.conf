# Author: Yogesh Agrawal
# Nginx edge layer: TLS termination, rate limiting, WAF-lite request filtering,
# reverse proxy to the FastAPI app, and static UI serving.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;                 # hide version (WAF-lite)
    client_max_body_size 1m;           # cap request size (WAF-lite)
    large_client_header_buffers 4 8k;

    # ---- Rate limiting (per client IP) ----
    # Default 4 req/s (configurable intent); burst smooths spikes.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=4r/s;
    limit_req_status 429;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Shared routing used by both the HTTP (8080) and HTTPS (8443) servers.
    # (Defined via a map-free approach: duplicated in each server for clarity.)

    # ---- HTTP edge (8080) ----
    server {
        listen 8080;
        server_name _;

        # ---- WAF-lite: block obvious bad patterns in the URI ----
        if ($request_uri ~* "(\.\./|<script|union\s+select|/etc/passwd)") {
            return 403;
        }

        # Static UI
        location / {
            root /srv/app/app/ui;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API + auth -> FastAPI (rate limited)
        location ~ ^/(api|auth)/ {
            limit_req zone=api_zone burst=8 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # Health passthrough (not rate limited)
        location = /healthz {
            proxy_pass http://127.0.0.1:8000/healthz;
        }
    }

    # ---- HTTPS edge (8443, self-signed cert for the demo) ----
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($request_uri ~* "(\.\./|<script|union\s+select|/etc/passwd)") {
            return 403;
        }

        location / {
            root /srv/app/app/ui;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/(api|auth)/ {
            limit_req zone=api_zone burst=8 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8000/healthz;
        }
    }
}
